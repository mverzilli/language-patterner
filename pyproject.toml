[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "language-patterner"
version = "0.1.0"
description = "Static site generator for Pattern Language books"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "python-frontmatter>=1.0",
    "markdown>=3.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
patterner = "patterner.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patterner = ["../../templates/*.html", "../../static/*"]
